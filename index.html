    <style>
:root {
  color-scheme: light;
  --ink: #172038;
  --muted: #65708a;
  --navy: #15203b;
  --navy-2: #23345d;
  --paper: #ffffff;
  --ground: #f1f4f9;
  --line: #dce2ed;
  --accent: #f3a83b;
  --accent-dark: #bd6e08;
  --blue: #4767d8;
  --blue-soft: #edf1ff;
  --green: #128066;
  --green-soft: #e7f7f1;
  --red: #c74646;
  --red-soft: #fff0f0;
  --shadow: 0 18px 50px rgba(21, 32, 59, 0.1);
  font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; min-width: 320px; color: var(--ink); background: var(--ground); }
button, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid rgba(71, 103, 216, .35); outline-offset: 3px; }

/* 簡易パスワード画面（GitHub Pages向け・本格的なアクセス制御ではありません） */
#passwordGate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: linear-gradient(145deg, #15203b, #23345d); }
#passwordGate[hidden] { display: none; }
.password-card { width: min(100%, 420px); padding: 34px; border-radius: 20px; background: #fff; box-shadow: 0 24px 70px rgba(0,0,0,.28); }
.password-card h1 { font-size: 1.55rem; margin-bottom: 8px; }
.password-card p { color: #65708a; line-height: 1.7; }
.password-card label { display: block; margin: 22px 0 8px; font-weight: 700; }
.password-card input { width: 100%; padding: 13px 14px; border: 1px solid #cbd3e1; border-radius: 10px; font: inherit; }
.password-card button { width: 100%; margin-top: 14px; padding: 13px 16px; border: 0; border-radius: 10px; background: #15203b; color: #fff; font-weight: 800; }
.password-error { min-height: 1.5em; margin: 10px 0 0; color: #c74646; font-size: .88rem; }

.topbar {
  min-height: 74px; display: flex; align-items: center; justify-content: space-between;
  padding: 12px max(20px, calc((100vw - 1120px) / 2)); background: var(--navy); color: white;
  position: sticky; top: 0; z-index: 20; box-shadow: 0 8px 24px rgba(11, 18, 36, .18);
}
.brand { display: flex; align-items: center; gap: 12px; color: inherit; background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; background: var(--accent); color: var(--navy); font-weight: 900; border-radius: 12px 5px 12px 5px; }
.brand b, .brand small { display: block; }
.brand b { font-size: 1rem; letter-spacing: .02em; }
.brand small { margin-top: 2px; color: #bfc9e1; font-size: .76rem; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.saved-note { color: #c7d0e5; font-size: .78rem; }
.icon-button { min-width: 40px; min-height: 40px; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; color: inherit; background: rgba(255,255,255,.08); font-size: 1.3rem; }

#app { max-width: 1120px; margin: 0 auto; padding: 34px 20px 72px; }
.eyebrow { color: var(--blue); font-weight: 800; font-size: .75rem; letter-spacing: .16em; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: clamp(1.75rem, 5vw, 3rem); line-height: 1.2; letter-spacing: -.035em; margin-bottom: 12px; }
h2 { font-size: clamp(1.35rem, 3vw, 1.8rem); line-height: 1.35; margin-bottom: 10px; }
h3 { font-size: 1.05rem; margin-bottom: 6px; }
.lead { max-width: 680px; color: var(--muted); line-height: 1.8; font-size: 1rem; }
.home-intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.goal-chip { flex: 0 0 auto; border: 1px solid #ffd18e; background: #fff8e9; color: #8b5204; padding: 12px 16px; border-radius: 14px; font-weight: 750; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0 30px; }
.stat-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 5px 20px rgba(21,32,59,.04); }
.stat-card span { display: block; color: var(--muted); font-size: .82rem; }
.stat-card strong { display: block; font-size: 1.75rem; margin-top: 4px; letter-spacing: -.04em; }
.stat-card strong small { font-size: .8rem; color: var(--muted); letter-spacing: 0; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 34px 0 14px; }
.section-title h2 { margin: 0; }
.section-title span { color: var(--muted); font-size: .84rem; }
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.mode-card { min-height: 192px; text-align: left; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); color: var(--ink); box-shadow: 0 6px 24px rgba(21,32,59,.05); transition: transform .18s, border-color .18s, box-shadow .18s; }
.mode-card:hover { transform: translateY(-3px); border-color: #aebbe2; box-shadow: var(--shadow); }
.mode-card.primary { color: white; border-color: var(--navy); background: linear-gradient(145deg, var(--navy), var(--navy-2)); }
.mode-card.primary p { color: #c8d1e6; }
.mode-card .mode-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: var(--blue-soft); color: var(--blue); font-weight: 900; margin-bottom: 26px; }
.mode-card.primary .mode-icon { background: rgba(255,255,255,.12); color: var(--accent); }
.mode-card p { color: var(--muted); line-height: 1.6; margin: 0; font-size: .9rem; }
.mode-card .card-link { display: block; margin-top: 14px; color: var(--blue); font-weight: 750; }
.mode-card.primary .card-link { color: var(--accent); }

.chapter-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.chapter-button { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 16px; color: var(--ink); }
.chapter-button:hover { border-color: var(--blue); }
.chapter-button b { display: block; margin-bottom: 5px; }
.chapter-button span { color: var(--muted); font-size: .78rem; }
.chapter-meter { height: 5px; margin-top: 14px; border-radius: 99px; background: #e6eaf2; overflow: hidden; }
.chapter-meter i { display: block; height: 100%; background: var(--blue); border-radius: inherit; }

.quiz-shell { max-width: 820px; margin: 0 auto; }
.quiz-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
.quiz-status { color: var(--muted); font-size: .9rem; }
.timer { min-width: 96px; text-align: center; padding: 9px 12px; border-radius: 10px; background: var(--navy); color: white; font-weight: 800; font-variant-numeric: tabular-nums; }
.timer.warning { background: var(--red); }
.progress-track { height: 7px; background: #dfe4ed; border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
.progress-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), #7790e8); transition: width .25s; }
.question-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: clamp(22px, 5vw, 38px); box-shadow: var(--shadow); }
.question-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 22px; }
.tag { display: inline-flex; align-items: center; min-height: 27px; padding: 4px 9px; border-radius: 7px; background: #eef1f6; color: #58647c; font-size: .73rem; font-weight: 700; }
.tag.chapter { background: var(--navy); color: white; }
.question-text { white-space: pre-line; font-size: clamp(1.08rem, 3vw, 1.3rem); line-height: 1.75; font-weight: 700; margin-bottom: 24px; }
.choices { display: grid; gap: 11px; }
.choice { width: 100%; display: flex; align-items: flex-start; gap: 13px; text-align: left; color: var(--ink); background: white; border: 1.5px solid #d7ddea; border-radius: 13px; padding: 15px 16px; line-height: 1.6; }
.choice:hover:not(:disabled) { border-color: #8799d5; background: #f8f9ff; }
.choice.selected { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 1px var(--blue); }
.choice.correct { border-color: var(--green); background: var(--green-soft); }
.choice.wrong { border-color: var(--red); background: var(--red-soft); }
.choice:disabled { cursor: default; opacity: 1; }
.choice-number { flex: 0 0 29px; height: 29px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 8px; font-weight: 800; font-size: .82rem; }
.choice.selected .choice-number { background: var(--blue); color: white; border-color: var(--blue); }
.choice.correct .choice-number { background: var(--green); color: white; border-color: var(--green); }
.choice.wrong .choice-number { background: var(--red); color: white; border-color: var(--red); }

.answer-panel { margin-top: 22px; padding: 20px; border-left: 5px solid var(--green); border-radius: 4px 13px 13px 4px; background: var(--green-soft); }
.answer-panel.incorrect { border-color: var(--red); background: var(--red-soft); }
.answer-panel h3 { color: var(--green); }
.answer-panel.incorrect h3 { color: var(--red); }
.answer-panel p { line-height: 1.75; margin-bottom: 12px; }
.source-link { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: .85rem; font-weight: 700; }
.source-note { display: block; color: var(--muted); font-size: .74rem; margin-top: 5px; }
.quiz-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; }
.action-right { display: flex; gap: 10px; margin-left: auto; }
.primary-button, .secondary-button, .danger-button { min-height: 46px; border-radius: 11px; padding: 10px 18px; font-weight: 800; }
.primary-button { border: 1px solid var(--navy); background: var(--navy); color: white; }
.primary-button:hover { background: var(--navy-2); }
.primary-button:disabled { opacity: .42; cursor: not-allowed; }
.secondary-button { border: 1px solid var(--line); background: white; color: var(--ink); }
.secondary-button.active { border-color: var(--accent-dark); color: #8b5204; background: #fff8e9; }
.danger-button { border: 1px solid #f0b4b4; background: var(--red-soft); color: #9b3030; width: 100%; }

.result-wrap { max-width: 880px; margin: 0 auto; }
.result-hero { text-align: center; background: var(--navy); color: white; border-radius: 24px; padding: 38px 24px; box-shadow: var(--shadow); }
.result-hero .eyebrow { color: var(--accent); }
.score-ring { width: 150px; height: 150px; display: grid; place-items: center; margin: 24px auto; border-radius: 50%; background: conic-gradient(var(--accent) var(--score), rgba(255,255,255,.14) 0); position: relative; }
.score-ring::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: var(--navy); }
.score-ring strong { position: relative; font-size: 2.2rem; }
.score-ring small { font-size: .85rem; color: #c8d1e6; }
.result-hero p { color: #ccd4e7; }
.result-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.result-hero .secondary-button { background: transparent; color: white; border-color: rgba(255,255,255,.35); }
.result-list { margin-top: 20px; display: grid; gap: 9px; }
.result-row { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); background: white; border-radius: 12px; }
.result-row .ok { color: var(--green); font-weight: 800; }
.result-row .ng { color: var(--red); font-weight: 800; }
.empty-card { text-align: center; background: white; border: 1px solid var(--line); border-radius: 20px; padding: 48px 24px; }

dialog { width: min(92vw, 460px); border: 0; border-radius: 18px; padding: 0; box-shadow: 0 30px 90px rgba(7,14,32,.28); }
dialog::backdrop { background: rgba(9,15,30,.58); backdrop-filter: blur(3px); }
.dialog-card { padding: 24px; }
.dialog-head { display: flex; justify-content: space-between; align-items: flex-start; }
.dialog-head .icon-button { color: var(--ink); border-color: var(--line); background: white; }
.dialog-card p { color: var(--muted); line-height: 1.7; }

@media (max-width: 820px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .mode-grid { grid-template-columns: 1fr; }
  .mode-card { min-height: 0; }
  .mode-card .mode-icon { margin-bottom: 18px; }
  .chapter-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 560px) {
  .topbar { min-height: 64px; padding: 10px 14px; }
  .brand b { font-size: .9rem; }
  .brand small, .saved-note { display: none; }
  .brand-mark { width: 38px; height: 38px; }
  #app { padding: 24px 14px 56px; }
  .home-intro { display: block; }
  .goal-chip { display: inline-block; margin-top: 8px; }
  .stats-grid { gap: 8px; }
  .stat-card { padding: 14px; }
  .stat-card strong { font-size: 1.45rem; }
  .chapter-grid { grid-template-columns: 1fr; }
  .quiz-toolbar { align-items: flex-start; }
  .question-card { border-radius: 17px; }
  .choice { padding: 13px; }
  .quiz-actions { align-items: stretch; flex-direction: column; }
  .action-right { width: 100%; }
  .action-right > * { flex: 1; }
  .result-row { grid-template-columns: 52px 1fr; }
  .result-row > :last-child { grid-column: 2; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

</style>

  <body>
    <section id="passwordGate" aria-labelledby="passwordTitle">
      <form class="password-card" id="passwordForm">
        <span class="eyebrow">PRIVATE STUDY SITE</span>
        <h1 id="passwordTitle">パスワードを入力</h1>
        <p>この学習サイトを開くには、設定したパスワードが必要です。</p>
        <label for="passwordInput">パスワード</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">サイトを開く</button>
        <p class="password-error" id="passwordError" role="alert" aria-live="polite"></p>
      </form>
    </section>
    <script>
      (() => {
        // パスワードを変える場合は、右側の文字だけを書き換えてください。
        const sitePassword = "GenAI-Passport-2026!";
        const unlockedKey = "genai-passport-unlocked";
        const gate = document.getElementById("passwordGate");
        const form = document.getElementById("passwordForm");
        const input = document.getElementById("passwordInput");
        const error = document.getElementById("passwordError");

        if (sessionStorage.getItem(unlockedKey) === "true") gate.hidden = true;
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (input.value === sitePassword) {
            sessionStorage.setItem(unlockedKey, "true");
            gate.hidden = true;
            input.value = "";
          } else {
            error.textContent = "パスワードが違います。";
            input.select();
          }
        });
      })();
    </script>
    <header class="topbar">
      <button class="brand" id="homeButton" type="button" aria-label="ホームへ戻る">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span><b>一発合格トレーニング</b><small>生成AIパスポート 2026</small></span>
      </button>
      <div class="topbar-actions">
        <span class="saved-note" id="savedNote">この端末に自動保存</span>
        <button class="icon-button" id="settingsButton" type="button" aria-label="設定を開く" title="設定">⋯</button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <dialog id="settingsDialog">
      <form method="dialog" class="dialog-card">
        <div class="dialog-head">
          <div><span class="eyebrow">SETTINGS</span><h2>学習データ</h2></div>
          <button class="icon-button" value="cancel" aria-label="閉じる">×</button>
        </div>
        <p>回答履歴と要復習リストは、この端末のブラウザ内だけに保存されます。</p>
        <button class="danger-button" id="resetButton" type="button">学習データをすべて消去</button>
      </form>
    </dialog>

explanation":"自律実行には権限の最小化、人の確認、上限、監査ログ等の統制が必要です。","evidenceType":"公式資料準拠・独自作成","sourceName":"経済産業省 AI事業者ガイドライン","sourceUrl":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/20240419_report.html","reviewedAt":"2026-09-14"},{"id":"Q150","chapter":"第5章","section":"プロンプティング","topic":"プロンプト構造","format":"事例判断","difficulty":"標準","question":"要約結果を安定させる指示として最も適切なものはどれですか。","choices":["短くして","あなたは編集者です。以下を対象読者・文字数・出力形式を守って要約してください","いい感じにして","とにかく正確に"],"answer":2,"explanation":"役割、指示、対象、制約、出力形式を具体化すると意図が伝わりやすくなります。","evidenceType":"公式資料準拠・独自作成","sourceName":"GUGA公式シラバス","sourceUrl":"https://guga.or.jp/assets/syllabus.pdf","reviewedAt":"2026-09-14"},{"id":"Q151","chapter":"第5章","section":"ハイパーパラメータ","topic":"Temperature","format":"事例判断","difficulty":"標準","question":"多様なキャッチコピー案を得たい。一般的なTemperature調整として適切なのはどれですか。","choices":["低くして固定化する","適度に高くして多様性を増やす","0未満にする","文字数と同じ値にする"],"answer":2,"explanation":"一般にTemperatureを高めると出力の多様性が増します。","evidenceType":"公式資料準拠・独自作成","sourceName":"GUGA公式シラバス","sourceUrl":"https://guga.or.jp/assets/syllabus.pdf","reviewedAt":"2026-09-14"},{"id":"Q152","chapter":"第4章","section":"知的財産権","topic":"著作権確認","format":"事例判断","difficulty":"標準","question":"生成AI画像を広告に使う際、最も適切な対応はどれですか。","choices":["AI生成なので権利確認不要","既存著作物との類似、利用規約、入力素材の権利を確認する","無料サービスなら必ず商用利用可能","少し加工すれば必ず侵害しない"],"answer":2,"explanation":"生成物でも既存著作物との類似や利用規約、入力素材の権利等を確認します。","evidenceType":"公式資料準拠・独自作成","sourceName":"文化庁 著作権","sourceUrl":"https://www.bunka.go.jp/seisaku/chosakuken/","reviewedAt":"2026-09-14"},{"id":"Q153","chapter":"第4章","section":"セキュリティ","topic":"フィッシング","format":"事例判断","difficulty":"標準","question":"取引先を名乗るメールから『緊急でパスワード確認』というリンクが届いた。適切な初動はどれですか。","choices":["リンクを開く","返信して聞く","リンクを開かず既知の連絡先や公式サイトから確認する","同僚へ転送して開いてもらう"],"answer":3,"explanation":"不審なリンクを開かず、別の信頼できる経路で確認します。","evidenceType":"公式資料準拠・独自作成","sourceName":"GUGA公式シラバス","sourceUrl":"https://guga.or.jp/assets/syllabus.pdf","reviewedAt":"2026-09-14"},{"id":"Q154","chapter":"第4章","section":"セキュリティ","to /20240419_report.html","reviewedAt":"2026-09-14"},{"id":"Q159","chapter":"第1章","section":"過学習","topic":"性能評価","format":"事例判断","difficulty":"標準","question":"訓練データでは高精度だが初見データでは精度が大幅に落ちた。考えられる状態はどれですか。","choices":["転移学習","過学習","次元削減","強化学習"],"answer":2,"explanation":"訓練データへ適合しすぎ未知データへの性能が低下する状態が過学習です。","evidenceType":"公式資料準拠・独自作成","sourceName":"GUGA公式シラバス","sourceUrl":"https://guga.or.jp/assets/syllabus.pdf","reviewedAt":"2026-09-14"},{"id":"Q160","chapter":"第1章","section":"機械学習","topic":"教師あり学習","format":"事例判断","difficulty":"標準","question":"メールに『迷惑／通常』の正解ラベルを付けて分類器を学習させる手法はどれですか。","choices":["教師あり学習","教師なし学習","強化学習","次元削減"],"answer":1,"explanation":"入力と正解ラベルの組を利用するため教師あり学習です。","evidenceType":"公式資料準拠・独自作成","sourceName":"GUGA公式シラバス","sourceUrl":"https://guga.or.jp/assets/syllabus.pdf","reviewedAt":"2026-09-14"},{"id":"Q161","chapter":"第2章","section":"生成モデル","topic":"GAN","format":"事例判断","difficulty":"標準","question":"生成器と識別器を競わせ本物らしいデータを生成する方式はどれですか。","choices":["VAE","GAN","RNN","BERT"],"answer":2,"explanation":"GANは生成器と識別器を競わせて学習します。","evidenceType":"公式資料準拠・独自作成","sourceName":"GUGA公式シラバス","sourceUrl":"https://guga.or.jp/assets/syllabus.pdf","reviewedAt":"2026-09-14"},{"id":"Q162","chapter":"第5章","section":"生成AIの不得意","topic":"最新情報","format":"事例判断","difficulty":"標準","question":"『今日施行された制度』を質問する際の対応として適切なのはどれですか。","choices":["回答を無条件で信頼","知識時点を確認し最新の一次情報で検証","長文なら最新と判断","固有名詞があれば正しい"],"answer":2,"explanation":"最新情報はモデルの参照可能時点を確認し、公式な一次情報で検証します。","evidenceType":"公式資料準拠・独自作成","sourceName":"GUGA公式シラバス","sourceUrl":"https://guga.or.jp/assets/syllabus.pdf","reviewedAt":"2026-09-14"}];

</script>
    <script>
(() => {
  "use strict";

  const bank = Array.isArray(window.QUESTION_BANK) ? window.QUESTION_BANK : [];
  const storageKey = "genai-passport-study-2026-v1";
  const app = document.getElementById("app");
  const homeButton = document.getElementById("homeButton");
  const settingsButton = document.getElementById("settingsButton");
  const settingsDialog = document.getElementById("settingsDialog");
  const resetButton = document.getElementById("resetButton");

  const defaultState = () => ({ stats: {}, mockHistory: [] });

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      return saved && saved.stats ? saved : defaultState();
    } catch (_) {
      return defaultState();
    }
  }

  let state = loadState();
  let session = null;

  const escapeHtml = (value) => String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  function safeUrl(value) {
    try {
      const url = new URL(value);
      return ["https:", "http:"].includes(url.protocol) ? url.href : "#";
    } catch (_) {
      return "#";
    }
  }

  function saveState() {
    localStorage.setItem(storageKey, JSON.stringify(state));
    const note = document.getElementById("savedNote");
    if (note) {
      note.textContent = "保存しました";
      window.setTimeout(() => { note.textContent = "この端末に自動保存"; }, 900);
    }
  }

  function shuffle(items) {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  const questionStat = (id) => state.stats[id] || { attempts: 0, correct: 0, needsReview: false, manualReview: false };
  const chapters = [...new Set(bank.map((q) => q.chapter))].sort((a, b) => a.localeCompare(b, "ja", { numeric: true }));

  function totals() {
    const values = Object.values(state.stats);
    const attempts = values.reduce((sum, item) => sum + (item.attempts || 0), 0);
    const correct = values.reduce((sum, item) => sum + (item.correct || 0), 0);
    const answered = values.filter((item) => (item.attempts || 0) > 0).length;
    const review = bank.filter((q) => questionStat(q.id).needsReview).length;
    return { attempts, correct, answered, review, rate: attempts ? Math.round((correct / attempts) * 100) : 0 };
  }

  function chapterProgress(chapter) {
    const questions = bank.filter((q) => q.chapter === chapter);
    const mastered = questions.filter((q) => {
      const stat = questionStat(q.id);
      return stat.correct > 0 && !stat.needsReview;
    }).length;
    return { count: questions.length, mastered, rate: questions.length ? Math.round((mastered / questions.length) * 100) : 0 };
  }

  function stopTimer() {
    if (session?.timerId) window.clearInterval(session.timerId);
    if (session) session.timerId = null;
  }

  function goHome() {
    stopTimer();
    session = null;
    renderHome();
  }

  function renderHome() {
    const t = totals();
    app.innerHTML = `
      <section class="home-intro">
        <div>
          <span class="eyebrow">YOUR STUDY DESK</span>
          <h1>一発合格まで、<br>迷わず解く。</h1>
          <p class="lead">全${bank.length}問から、章別・ランダム・本番形式で繰り返せます。間違えた問題は自動で「要復習」に集まります。</p>
        </div>
        <div class="goal-chip">目標：10月試験・一発合格</div>
      </section>

      <section class="stats-grid" aria-label="学習状況">
        <div class="stat-card"><span>学習済み</span><strong>${t.answered}<small> / ${bank.length}問</small></strong></div>
        <div class="stat-card"><span>総回答数</span><strong>${t.attempts}<small> 回</small></strong></div>
        <div class="stat-card"><span>正答率</span><strong>${t.rate}<small> %</small></strong></div>
        <div class="stat-card"><span>要復習</span><strong>${t.review}<small> 問</small></strong></div>
      </section>

      <div class="section-title"><h2>今日のトレーニング</h2><span>解いた分だけ自動保存</span></div>
      <section class="mode-grid">
        <button class="mode-card primary" type="button" data-start="quick">
          <span class="mode-icon">10</span><h3>ランダム10問</h3>
          <p>全範囲から10問。すきま時間の確認に。</p><span class="card-link">すぐ始める →</span>
        </button>
        <button class="mode-card" type="button" data-start="review">
          <span class="mode-icon">↺</span><h3>要復習だけ</h3>
          <p>${t.review ? `${t.review}問の弱点を集中して解き直します。` : "間違えた問題や、印を付けた問題がここに集まります。"}</p><span class="card-link">復習を始める →</span>
        </button>
        <button class="mode-card" type="button" data-start="mock">
          <span class="mode-icon">60</span><h3>模擬試験</h3>
          <p>本番と同じ60問・60分。解説は採点後に確認できます。</p><span class="card-link">試験を始める →</span>
        </button>
      </section>

      <div class="section-title"><h2>章ごとに学ぶ</h2><span>各回ランダム10問</span></div>
      <section class="chapter-grid">
        ${chapters.map((chapter) => {
          const progress = chapterProgress(chapter);
          return `<button class="chapter-button" type="button" data-chapter="${escapeHtml(chapter)}">
            <b>${escapeHtml(chapter)}</b><span>${progress.count}問中 ${progress.mastered}問を習得</span>
            <div class="chapter-meter" aria-label="習得率${progress.rate}%"><i style="width:${progress.rate}%"></i></div>
          </button>`;
        }).join("")}
      </section>
    `;

    app.querySelectorAll("[data-start]").forEach((button) => {
      button.addEventListener("click", () => startSession(button.dataset.start));
    });
    app.querySelectorAll("[data-chapter]").forEach((button) => {
      button.addEventListener("click", () => startSession("chapter", button.dataset.chapter));
    });
    app.focus({ preventScroll: true });
  }

  function startSession(mode, chapter = null, customQuestions = null) {
    let questions;
    let label;
    if (customQuestions) {
      questions = customQuestions;
      label = "解き直し";
      mode = "review";
    } else if (mode === "quick") {
      questions = shuffle(bank).slice(0, 10);
      label = "ランダム10問";
    } else if (mode === "chapter") {
      questions = shuffle(bank.filter((q) => q.chapter === chapter)).slice(0, 10);
      label = `${chapter}｜10問`;
    } else if (mode === "review") {
      questions = shuffle(bank.filter((q) => questionStat(q.id).needsReview));
      label = "要復習";
    } else {
      questions = shuffle(bank).slice(0, 60);
      label = "模擬試験｜60問";
    }

    if (!questions.length) {
      renderEmptyReview();
      return;
    }

    session = {
      mode,
      label,
      questions,
      index: 0,
      selected: {},
      revealed: {},
      timeLeft: mode === "mock" ? 60 * 60 : null,
      timerId: null,
    };

    if (mode === "mock") startTimer();
    renderQuestion();
  }

  function renderEmptyReview() {
    app.innerHTML = `
      <section class="empty-card">
        <span class="eyebrow">REVIEW</span>
        <h1>要復習の問題はありません</h1>
        <p class="lead" style="margin-inline:auto">まずはランダム10問か章別学習を進めましょう。間違えた問題は、自動でここに入ります。</p>
        <button class="primary-button" id="emptyStart">ランダム10問を始める</button>
      </section>`;
    document.getElementById("emptyStart").addEventListener("click", () => startSession("quick"));
  }

  function startTimer() {
    stopTimer();
    session.timerId = window.setInterval(() => {
      session.timeLeft -= 1;
      const timer = document.getElementById("timer");
      if (timer) {
        timer.textContent = formatTime(session.timeLeft);
        timer.classList.toggle("warning", session.timeLeft <= 300);
      }
      if (session.timeLeft <= 0) finishMock();
    }, 1000);
  }

  function formatTime(seconds) {
    const min = Math.max(0, Math.floor(seconds / 60));
    const sec = Math.max(0, seconds % 60);
    return `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }

  function renderQuestion() {
    if (!session) return;
    const q = session.questions[session.index];
    const selected = session.selected[q.id];
    const revealed = Boolean(session.revealed[q.id]);
    const isMock = session.mode === "mock";
    const stat = questionStat(q.id);
    const progress = ((session.index + 1) / session.questions.length) * 100;

    app.innerHTML = `
      <section class="quiz-shell">
        <div class="quiz-toolbar">
          <div><span class="eyebrow">${isMock ? "MOCK EXAM" : "PRACTICE"}</span><div class="quiz-status">${escapeHtml(session.label)}　${session.index + 1} / ${session.questions.length}</div></div>
          ${isMock ? `<div class="timer${session.timeLeft <= 300 ? " warning" : ""}" id="timer" aria-label="残り時間">${formatTime(session.timeLeft)}</div>` : ""}
        </div>
        <div class="progress-track" aria-hidden="true"><i style="width:${progress}%"></i></div>

        <article class="question-card">
          <div class="question-meta">
            <span class="tag chapter">${escapeHtml(q.chapter)}</span>
            <span class="tag">${escapeHtml(q.section)}</span>
            <span class="tag">${escapeHtml(q.difficulty)}</span>
            <span class="tag">${escapeHtml(q.id)}</span>
          </div>
          <div class="question-text">${escapeHtml(q.question)}</div>
          <div class="choices" role="radiogroup" aria-label="選択肢">
            ${q.choices.map((choice, index) => {
              const number = index + 1;
              let className = "choice";
              if (selected === number) className += " selected";
              if (revealed && number === q.answer) className += " correct";
              if (revealed && selected === number && number !== q.answer) className += " wrong";
              return `<button class="${className}" type="button" role="radio" aria-checked="${selected === number}" data-choice="${number}" ${revealed ? "disabled" : ""}>
                <span class="choice-number">${number}</span><span>${escapeHtml(choice)}</span>
              </button>`;
            }).join("")}
          </div>

          ${revealed ? renderExplanation(q, selected) : ""}
        </article>

        <div class="quiz-actions">
          <button class="secondary-button${stat.needsReview ? " active" : ""}" id="reviewToggle" type="button">${stat.needsReview ? "★ 要復習に登録済み" : "☆ 要復習に入れる"}</button>
          <div class="action-right">
            ${isMock && session.index > 0 ? `<button class="secondary-button" id="prevButton" type="button">前の問題</button>` : ""}
            ${isMock
              ? `<button class="primary-button" id="mockNext" type="button">${session.index === session.questions.length - 1 ? "採点する" : "次の問題"}</button>`
              : revealed
                ? `<button class="primary-button" id="nextButton" type="button">${session.index === session.questions.length - 1 ? "結果を見る" : "次の問題"}</button>`
                : `<button class="primary-button" id="answerButton" type="button" ${selected ? "" : "disabled"}>回答する</button>`}
          </div>
        </div>
      </section>
    `;

    app.querySelectorAll("[data-choice]").forEach((button) => {
      button.addEventListener("click", () => selectChoice(Number(button.dataset.choice)));
    });
    document.getElementById("reviewToggle").addEventListener("click", () => toggleReview(q.id));

    if (isMock) {
      const prev = document.getElementById("prevButton");
      if (prev) prev.addEventListener("click", () => moveMock(-1));
      document.getElementById("mockNext").addEventListener("click", () => {
        if (session.index === session.questions.length - 1) finishMock();
        else moveMock(1);
      });
    } else if (revealed) {
      document.getElementById("nextButton").addEventListener("click", nextPractice);
    } else {
      document.getElementById("answerButton").addEventListener("click", answerPractice);
    }
    app.focus({ preventScroll: true });
  }

  function renderExplanation(q, selected) {
    const correct = selected === q.answer;
    const source = safeUrl(q.sourceUrl);
    return `<div class="answer-panel${correct ? "" : " incorrect"}" aria-live="polite">
      <h3>${correct ? "正解です" : `不正解｜正解は ${q.answer}`}</h3>
      <p>${escapeHtml(q.explanation)}</p>
      ${source !== "#" ? `<a class="source-link" href="${escapeHtml(source)}" target="_blank" rel="noopener noreferrer">根拠を確認：${escapeHtml(q.sourceName)} ↗</a>` : ""}
      <span class="source-note">${escapeHtml(q.evidenceType)}${q.reviewedAt ? ` ／ 参照日 ${escapeHtml(q.reviewedAt)}` : ""}</span>
    </div>`;
  }

  function selectChoice(number) {
    if (!session) return;
    const q = session.questions[session.index];
    if (session.revealed[q.id]) return;
    session.selected[q.id] = number;
    renderQuestion();
  }

  function answerPractice() {
    const q = session.questions[session.index];
    const selected = session.selected[q.id];
    if (!selected || session.revealed[q.id]) return;
    const correct = selected === q.answer;
    const previous = questionStat(q.id);
    state.stats[q.id] = {
      ...previous,
      attempts: (previous.attempts || 0) + 1,
      correct: (previous.correct || 0) + (correct ? 1 : 0),
      needsReview: correct ? Boolean(previous.manualReview) : true,
      lastAnswered: new Date().toISOString(),
    };
    session.revealed[q.id] = true;
    saveState();
    renderQuestion();
  }

  function toggleReview(id) {
    const previous = questionStat(id);
    const next = !previous.needsReview;
    state.stats[id] = { ...previous, needsReview: next, manualReview: next };
    saveState();
    renderQuestion();
  }

  function nextPractice() {
    if (session.index >= session.questions.length - 1) {
      renderPracticeResult();
      return;
    }
    session.index += 1;
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderQuestion();
  }

  function moveMock(amount) {
    session.index = Math.min(session.questions.length - 1, Math.max(0, session.index + amount));
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderQuestion();
  }

  function renderPracticeResult() {
    const results = session.questions.map((q) => ({ q, selected: session.selected[q.id], correct: session.selected[q.id] === q.answer }));
    const correctCount = results.filter((item) => item.correct).length;
    renderResult(results, correctCount, "トレーニング完了");
  }

  function finishMock() {
    if (!session || session.mode !== "mock") return;
    stopTimer();
    const results = session.questions.map((q) => ({ q, selected: session.selected[q.id], correct: session.selected[q.id] === q.answer }));
    const correctCount = results.filter((item) => item.correct).length;

    results.forEach(({ q, correct }) => {
      const previous = questionStat(q.id);
      state.stats[q.id] = {
        ...previous,
        attempts: (previous.attempts || 0) + 1,
        correct: (previous.correct || 0) + (correct ? 1 : 0),
        needsReview: correct ? Boolean(previous.manualReview) : true,
        lastAnswered: new Date().toISOString(),
      };
    });
    state.mockHistory = [...(state.mockHistory || []), { date: new Date().toISOString(), score: correctCount, total: results.length }].slice(-20);
    saveState();
    renderResult(results, correctCount, "模擬試験終了");
  }

  function renderResult(results, correctCount, title) {
    const rate = Math.round((correctCount / results.length) * 100);
    const wrongQuestions = results.filter((item) => !item.correct).map((item) => item.q);
    app.innerHTML = `
      <section class="result-wrap">
        <div class="result-hero">
          <span class="eyebrow">RESULT</span>
          <h1>${escapeHtml(title)}</h1>
          <div class="score-ring" style="--score:${rate}%"><strong>${rate}<small>%</small></strong></div>
          <p>${results.length}問中 ${correctCount}問正解${wrongQuestions.length ? `。間違えた${wrongQuestions.length}問は「要復習」に追加しました。` : "。全問正解です。"}</p>
          <div class="result-actions">
            ${wrongQuestions.length ? `<button class="primary-button" id="retryWrong" type="button">間違えた問題を解き直す</button>` : ""}
            <button class="secondary-button" id="resultHome" type="button">ホームへ戻る</button>
          </div>
        </div>
        <div class="section-title"><h2>回答一覧</h2><span>${correctCount} / ${results.length}問正解</span></div>
        <div class="result-list">
          ${results.map(({ q, selected, correct }) => `<div class="result-row">
            <b>${escapeHtml(q.id)}</b>
            <span>${escapeHtml(q.topic || q.section)}</span>
            <span class="${correct ? "ok" : "ng"}">${correct ? "○ 正解" : `× ${selected ? `選択${selected}` : "未回答"}／正解${q.answer}`}</span>
          </div>`).join("")}
        </div>
      </section>`;

    document.getElementById("resultHome").addEventListener("click", goHome);
    const retry = document.getElementById("retryWrong");
    if (retry) retry.addEventListener("click", () => startSession("review", null, shuffle(wrongQuestions)));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  homeButton.addEventListener("click", () => {
    if (session && session.mode === "mock" && !window.confirm("模擬試験を終了してホームへ戻りますか？")) return;
    goHome();
  });
  settingsButton.addEventListener("click", () => settingsDialog.showModal());
  resetButton.addEventListener("click", () => {
    if (!window.confirm("回答履歴と要復習リストをすべて消去します。よろしいですか？")) return;
    state = defaultState();
    localStorage.removeItem(storageKey);
    settingsDialog.close();
    goHome();
  });

  document.addEventListener("keydown", (event) => {
    if (!session || settingsDialog.open) return;
    if (["1", "2", "3", "4"].includes(event.key)) {
      selectChoice(Number(event.key));
      return;
    }
    if (event.key === "Enter" && session.mode !== "mock") {
      const q = session.questions[session.index];
      if (session.revealed[q.id]) nextPractice();
      else answerPractice();
    }
  });

  function registerStudyTools() {
    const context = document.modelContext;
    if (!context?.registerTool) return;
    const register = (tool) => {
      try { void Promise.resolve(context.registerTool(tool)).catch(() => {}); } catch (_) { /* unsupported preview */ }
    };
    register({
      name: "get_study_progress",
      title: "学習進捗を確認",
      description: "生成AIパスポート問題集の回答数、正答率、要復習数を確認します。",
      inputSchema: { type: "object", properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true, untrustedContentHint: false },
      execute() { return { totalQuestions: bank.length, ...totals() }; },
    });
    register({
      name: "start_study_session",
      title: "学習を開始",
      description: "ランダム10問、要復習、模擬試験、または指定章の学習を画面で開始します。",
      inputSchema: {
        type: "object",
        properties: {
          mode: { type: "string", enum: ["quick", "review", "mock", "chapter"] },
          chapter: { type: "string", enum: chapters },
        },
        required: ["mode"],
        additionalProperties: false,
      },
      annotations: { readOnlyHint: false, untrustedContentHint: false },
      execute(input) {
        if (!input || !["quick", "review", "mock", "chapter"].includes(input.mode)) throw new Error("有効なmodeを指定してください。");
        if (input.mode === "chapter" && !chapters.includes(input.chapter)) throw new Error("章別学習では有効なchapterが必要です。");
        startSession(input.mode, input.chapter || null);
        return { started: true, mode: input.mode, chapter: input.chapter || null, questionCount: session?.questions.length || 0 };
      },
    });
  }

  registerStudyTools();

  if (!bank.length) {
    app.innerHTML = `<section class="empty-card"><h1>問題データを読み込めませんでした</h1><p>ページを再読み込みしてください。</p></section>`;
  } else {
    renderHome();
  }
})();

</script>
  </body>
</html>
